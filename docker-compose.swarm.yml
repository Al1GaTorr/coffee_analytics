version: "3.9"

x-service-defaults: &service-defaults
  image: coffee-analytics-backend:latest
  networks:
    - coffee-net
  deploy:
    replicas: 2
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
    update_config:
      parallelism: 1
      delay: 10s
      order: start-first
      failure_action: rollback
    rollback_config:
      parallelism: 1
      delay: 5s
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
      reservations:
        cpus: "0.10"
        memory: 64M

services:
  frontend:
    <<: *service-defaults
    command: ["node", "frontend/server.js"]
    ports:
      - "5173:5173"
    environment:
      GATEWAY_URL: http://api-gateway:8080
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-gateway:
    <<: *service-defaults
    command: ["node", "src/services/gateway/server.js"]
    ports:
      - "8080:8080"
    environment:
      AUTH_URL: http://auth-service:3001
      CATALOG_URL: http://catalog-service:3002
      ORDER_URL: http://order-service:3003
      PAYMENT_URL: http://payment-service:3004
      NOTIFICATION_URL: http://notification-service:3005
      PROFILE_URL: http://profile-service:3006
      ANALYTICS_URL: http://analytics-service:3007
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth-service:
    <<: *service-defaults
    command: ["node", "src/services/auth/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  catalog-service:
    <<: *service-defaults
    command: ["node", "src/services/catalog/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  order-service:
    <<: *service-defaults
    command: ["node", "src/services/orders/server.js"]
    environment:
      CATALOG_URL: http://catalog-service:3002
      PAYMENT_URL: http://payment-service:3004
      NOTIFICATION_URL: http://notification-service:3005
      ANALYTICS_URL: http://analytics-service:3007
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-service:
    <<: *service-defaults
    command: ["node", "src/services/payments/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    <<: *service-defaults
    command: ["node", "src/services/notifications/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  profile-service:
    <<: *service-defaults
    command: ["node", "src/services/profiles/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  analytics-service:
    <<: *service-defaults
    command: ["node", "src/services/analytics/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    networks:
      - coffee-net
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee_analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    networks:
      - coffee-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    networks:
      - coffee-net
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts
        target: /etc/prometheus/alerts.yml
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    networks:
      - coffee-net
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  coffee-net:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
  grafana-data:

configs:
  prometheus_config:
    file: ./monitoring/prometheus.yml
  prometheus_alerts:
    file: ./monitoring/alerts.yml
