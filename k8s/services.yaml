apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: coffee-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: coffee-analytics-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "frontend/server.js"]
          ports:
            - containerPort: 5173
          env:
            - name: GATEWAY_URL
              value: http://api-gateway:8080
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: coffee-analytics
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: coffee-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: coffee-analytics-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "src/services/gateway/server.js"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: coffee-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: coffee-analytics
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
