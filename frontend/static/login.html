<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corretto — Sign In</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .login-card {
        background: var(--paper-strong);
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        box-shadow: var(--shadow);
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        animation: fadeUp 0.4s ease both;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .login-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
      }
      .login-logo {
        width: 3.5rem;
        height: 3.5rem;
        border: 2px solid var(--coffee);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
      }
      .login-brand h1 {
        font-family: Georgia, serif;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-size: 1.4rem;
        color: var(--coffee-dark);
        margin: 0;
      }
      .login-brand p {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .login-form label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .login-form input {
        padding: 0.75rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        background: var(--paper);
        font-size: 0.95rem;
        color: var(--ink);
        outline: none;
        transition: border-color 0.2s;
      }
      .login-form input:focus {
        border-color: var(--coffee);
      }
      .login-hint {
        background: var(--cream);
        border-radius: 0.75rem;
        padding: 0.9rem 1rem;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .login-hint strong { color: var(--coffee-dark); }
      #loginMessage.error { color: #c0392b; font-size: 0.85rem; text-align: center; }
      #loginMessage.ok { color: #27ae60; font-size: 0.85rem; text-align: center; }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-logo">☕</div>
          <h1>Corretto</h1>
          <p>Sign in to continue</p>
        </div>

        <form class="login-form" id="loginForm">
          <label>
            Username
            <input id="loginEmail" type="text" placeholder="your username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </label>
          <button class="button primary full" type="submit">Sign In</button>
          <p id="loginMessage"></p>
        </form>

        <div class="login-hint">
          <strong>Demo accounts:</strong><br />
          👤 User: <code>alice</code> / <code>coffee123</code><br />
          👤 User: <code>bob</code> / <code>coffee123</code><br />
          🛡️ Admin: <code>admin</code> / <code>admin123</code>
        </div>
      </div>
    </div>

    <script type="module">
      // Check already logged in
      const session = JSON.parse(localStorage.getItem('correttoSession') || 'null');
      if (session) {
        window.location.href = session.role === 'admin' ? '/admin.html' : '/';
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('loginMessage');
        const username = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        msg.textContent = 'Signing in...';
        msg.className = '';
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: username, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Invalid credentials');
          localStorage.setItem('correttoSession', JSON.stringify({
            token: data.token,
            user: data.user,
            username: data.user.username || data.user.email,
            role: data.user.role
          }));
          msg.textContent = 'Welcome back!';
          msg.className = 'ok';
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? '/admin.html' : '/';
          }, 400);
        } catch (err) {
          msg.textContent = err.message;
          msg.className = 'error';
        }
      });
    </script>
  </body>
</html>
