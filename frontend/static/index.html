<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corretto Menu</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark" data-icon="coffee"></span><span>Corretto</span></a>
      <nav aria-label="Main navigation">
        <a href="/">Menu</a>
        <a href="/checkout.html">Order</a>
        <a href="/orders.html">My Orders</a>
        <a href="/admin.html">Admin</a>
      </nav>
    </header>

    <main>
      <section class="hero section-band">
        <div class="hero-copy">
          <p class="eyebrow">Coffee shop menu</p>
          <h1>Choose Coffee and Desserts</h1>
          <p class="hero-text">Browse hot coffee, ice coffee, and desserts. Ordering happens on a separate checkout page.</p>
          <div class="hero-actions">
            <a class="button primary" href="/checkout.html"><span data-icon="shopping-bag"></span>Start order</a>
            <a class="button secondary" href="/orders.html"><span data-icon="receipt"></span>Track order</a>
          </div>
        </div>
        <div class="hero-visual" aria-label="Coffee cup and beans visual">
          <div class="cup"><div class="coffee-surface"></div></div>
          <div class="hero-note"><span data-icon="server"></span><strong>Menu API</strong><small>Fetched from backend</small></div>
        </div>
      </section>

      <section class="section-band menu-section">
        <div class="section-heading">
          <p class="eyebrow">Fetched catalog</p>
          <h2>Coffee Menu</h2>
        </div>
        <p id="pageMessage" class="status-line"></p>
        <div id="menuGrid" class="catalog-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="/icons.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
