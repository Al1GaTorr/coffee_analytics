name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend
  NODE_VERSION: '20'

# ─────────────────────────────────────────────
# JOB 1 – Run tests
# ─────────────────────────────────────────────
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          

      # package.json has no dependencies, so we skip `npm ci`
      # but keep it here for when you add packages later
      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Run unit tests
        run: npm test

  # ─────────────────────────────────────────────
  # JOB 2 – Lint & static analysis
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Basic sanity: make sure all JS files parse without syntax errors
      - name: Syntax check – shared utilities
        run: node --check src/shared/*.js

      - name: Syntax check – services
        run: |
          node --check src/services/analytics/server.js
          node --check src/services/auth/server.js
          node --check src/services/catalog/server.js
          node --check src/services/gateway/server.js
          node --check src/services/notifications/server.js
          node --check src/services/orders/server.js
          node --check src/services/orders/application/orderUseCases.js
          node --check src/services/orders/domain/order.js
          node --check src/services/orders/infrastructure/clients.js
          node --check src/services/orders/interfaces/httpRoutes.js
          node --check src/services/payments/server.js
          node --check src/services/profiles/server.js
          node --check frontend/server.js

  # ─────────────────────────────────────────────
  # JOB 3 – Build & push Docker images
  # Only runs on push to master/main (not on PRs)
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend image ──────────────────────────
      - name: Extract backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ─────────────────────────
      - name: Extract frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 4 – Deploy (docker compose on your server)
  # Only runs on push to master/main after images are built
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # Pull latest code
            cd ~/coffee_analytics
            git pull origin master

            # Log in to GHCR on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Pull new images and restart stack
            docker compose pull
            docker compose up -d --remove-orphans

            # Quick health check – wait up to 30s for gateway
            for i in $(seq 1 6); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Gateway healthy"
                exit 0
              fi
              echo "Waiting for gateway... ($i/6)"
              sleep 5
            done
            echo "❌ Gateway did not become healthy"
            exit 1